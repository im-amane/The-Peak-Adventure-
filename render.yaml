services:
  - type: web
    name: the-peak-adventure
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_PATH
        value: /data/peak_adventure.db
      - key: BACKUP_DIR
        value: /data/backups
      - key: BACKUP_INTERVAL_SECONDS
        value: "21600"
      - key: BACKUP_RETENTION
        value: "7"
      - key: WEB_HOST
        value: 0.0.0.0
      - key: ENABLE_TELEGRAM_STARS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: peak-adventure-data
      mountPath: /data
      sizeGB: 1
