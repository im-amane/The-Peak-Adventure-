name: Adventure Bot Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest check run for a branch/PR; stale commits cannot be merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import main"
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python scripts/sync_cloudflare_assets.py --check
      - run: node --check webapp/game.js
      - run: node --check cloudflare/worker.mjs
      - run: node --test webapp/pathfinding.test.mjs
      - run: node --test webapp/movement.test.mjs
      - run: node --test webapp/character_profiles.test.mjs
      - run: node --test webapp/character_animation.test.mjs
      - run: node --test cloudflare/worker.test.mjs

  postgres-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peak_adventure_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peak_adventure_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/peak_adventure_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ca-certificates curl gnupg
      - run: sudo install -d /usr/share/postgresql-common/pgdg
      - run: curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
      - run: echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo ${VERSION_CODENAME})-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pg_dump --version && pg_restore --version
      - run: python -m unittest discover -s tests -p "test_postgres_adapter.py" -v
      - run: python -m unittest discover -s tests -p "test_matchmaking_postgres.py" -v
      - run: python -m unittest discover -s tests -p "test_miniapp_postgres_http.py" -v
      - run: python -m unittest discover -s tests -p "test_postgres_backup_integration.py" -v
